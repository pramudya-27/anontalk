version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: anontalk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anontalk
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/002_add_message_type.sql:/docker-entrypoint-initdb.d/002_add_message_type.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anontalk-redis
    ports:
      - "6380:6379"

  backend:
    build: .
    container_name: anontalk-backend
    environment:
      DATABASE_URL: root:root@tcp(mysql:3306)/anontalk
      JWT_SECRET: your-secret-key-change-in-production
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
